name: Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build --workspaces

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: password-webdav-extension
          path: apps/extension/dist
          if-no-files-found: error

      - name: Package extension release zip
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd apps/extension/dist
          zip -r ../../../password-webdav-extension-${{ github.ref_name }}.zip .

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: password-webdav-extension-${{ github.ref_name }}.zip
